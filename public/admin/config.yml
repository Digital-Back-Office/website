# Decap CMS config. Keep in step with src/content/config.ts (see CLAUDE.md, "Content editing").
backend:
  name: github
  repo: Digital-Back-Office/website
  branch: master
  auth_endpoint: admin/auth.html
local_backend: true
publish_mode: editorial_workflow
media_folder: public/assets/images
public_folder: /assets/images
site_url: https://digitalbackoffice.co.uk
display_url: https://digitalbackoffice.co.uk
collections:
  - name: home
    label: Home page
    media_folder: public/assets/images/home
    public_folder: /assets/images/home
    files:
      - label: Home page
        name: home
        file: src/content/home/home.md
        fields:
          - label: Hero
            name: hero
            widget: object
            collapsed: true
            fields:
              - {label: Title part 1, name: title_part_1, widget: string}
              - {label: Title part 2, name: title_part_2, widget: string}
              - {label: Pill text, name: pill_text, widget: string}
              - {label: Info, name: info, widget: text}
          - label: Partners
            name: partners
            widget: object
            collapsed: true
            fields:
              - {label: Title, name: title, widget: string}
              - label: Images
                name: images
                widget: list
                collapsed: true
                fields:
                  - {label: Name, name: name, widget: string}
                  - {label: Src, name: src, widget: string}
                summary: '{{fields.name}}'
          - label: Ai solutions
            name: ai_solutions
            widget: object
            collapsed: true
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Sub title, name: sub_title, widget: string}
              - {label: Cta text, name: cta_text, widget: string}
              - label: Cards
                name: cards
                widget: list
                collapsed: true
                fields:
                  - {label: Id, name: id, widget: string}
                  - {label: Heading, name: heading, widget: string}
                  - {label: Description, name: description, widget: string}
                  - {label: Icon, name: icon, widget: string}
                  - {label: Alt, name: alt, widget: string}
                  - {label: Button text, name: button_text, widget: string}
                summary: '{{fields.heading}}'
          - label: Roadmap
            name: roadmap
            widget: object
            collapsed: true
            fields:
              - {label: Title 1, name: title_1, widget: string}
              - {label: Title 2, name: title_2, widget: string}
              - {label: Sub title, name: sub_title, widget: string}
              - label: Cards
                name: cards
                widget: list
                collapsed: true
                fields:
                  - {label: Id, name: id, widget: string}
                  - {label: Heading, name: heading, widget: string}
                  - {label: Description, name: description, widget: text}
                  - {label: Icon, name: icon, widget: string}
                summary: '{{fields.heading}}'
          - label: About
            name: about
            widget: object
            collapsed: true
            fields:
              - label: Parallax images
                name: parallax_images
                widget: list
                collapsed: true
                field: {label: Item, name: item, widget: image}
              - {label: Title, name: title, widget: string}
              - {label: Info part 1, name: info_part_1, widget: text}
              - {label: Info part 2, name: info_part_2, widget: text}
          - label: Key points
            name: keyPoints
            widget: list
            collapsed: true
            fields:
              - {label: Svg, name: svg, widget: string}
              - {label: Bg, name: bg, widget: string}
              - {label: Alt, name: alt, widget: string}
              - {label: Title, name: title, widget: string}
              - {label: Info, name: info, widget: text}
            summary: '{{fields.title}}'
          - label: Features
            name: features
            widget: object
            collapsed: true
            fields:
              - {label: Title, name: title, widget: string}
              - label: Cards
                name: cards
                widget: list
                collapsed: true
                fields:
                  - {label: Img, name: img, widget: string}
                  - {label: Alt, name: alt, widget: string}
                  - {label: Title, name: title, widget: string}
                  - {label: Info, name: info, widget: text}
                summary: '{{fields.title}}'
          - label: Tech
            name: tech
            widget: object
            collapsed: true
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Desc, name: desc, widget: string}
              - label: Slider 1
                name: slider_1
                widget: list
                collapsed: true
                field: {label: Item, name: item, widget: string}
              - label: Slider 2
                name: slider_2
                widget: list
                collapsed: true
                field: {label: Item, name: item, widget: string}
          - label: Testimonials
            name: testimonials
            widget: list
            collapsed: true
            fields:
              - {label: Number, name: number, widget: string, pattern: [^\d+$, Digits only]}
              - {label: Name, name: name, widget: string}
              - {label: Designation, name: designation, widget: string}
              - {label: Title, name: title, widget: string}
              - {label: Desc, name: desc, widget: text}
            summary: '{{fields.title}}'
